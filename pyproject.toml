[project]
name = "obs-lsd"
version = "0.1.0"
description = "Glowing psychedelic floating-head virtual camera for Zoom/OBS"
requires-python = "==3.12.*"
license = "AGPL-3.0-or-later"
authors = [{ name = "Danny O'Brien", email = "danny@spesh.com" }]
dependencies = [
    "click>=8.0",
    "numpy>=2.0",
    "opencv-python>=4.10,<6",
    "mediapipe>=0.10,<1.0",
    "pyvirtualcam>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
obs-lsd = "obs_lsd.cli:cli"

[build-system]
requires = ["uv_build>=0.9.6,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
# docs/ holds specs and plans; ruff reformats the Python snippets inside them
extend-exclude = ["docs"]
